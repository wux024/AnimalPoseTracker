name: docs

# Builds the Jupyter Book in the repository root (README.md is the landing page).
#
# A push builds the book so a broken link or a bad heading fails CI, but it does not
# publish: deployment only runs from a manual dispatch. That keeps the site offline while
# Settings → Pages → Source is set to "None"; when the site is ready to be public, set the
# source back to "GitHub Actions" and run this workflow from the Actions tab.

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "docs/**"
      - "_config.yml"
      - "_toc.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install the book toolchain
        run: pip install -r requirements-docs.txt

      - name: Build
        run: jupyter-book build .

      # Jekyll would try to interpret `_config.yml`; the artifact is static HTML already.
      - name: Disable Jekyll processing
        run: touch _build/html/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    needs: build
    # Only a manual run publishes; a push verifies the book and stops there.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
