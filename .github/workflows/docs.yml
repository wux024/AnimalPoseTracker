name: docs

# Builds and publishes the Jupyter Book in the repository root (README.md is the landing
# page). A push to main builds the book and deploys it; run the workflow manually to
# rebuild without a push.

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "docs/**"
      - "_config.yml"
      - "_toc.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install the book toolchain
        run: pip install -r requirements-docs.txt

      - name: Build
        run: jupyter-book build .

      # Jekyll would try to interpret `_config.yml`; the artifact is static HTML already.
      - name: Disable Jekyll processing
        run: touch _build/html/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
