# Project metadata with author information

# Build system requirements
# 69.0 is the floor for this file's features: project metadata (PEP 621),
# dynamic version, and recursive package-data globs ("**/..."). None of the
# 70.x changes (Cython-on-Windows fix, distutils deprecation) are needed here.
[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

# Project information
[project]
name = "animalposetracker"
dynamic = ["version"]
description = "Animal Pose Estimation and Tracking Toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { "text" = "AGPL-3.0-or-later" }
keywords = ["animal pose estimation", "computer vision", "neuroscience"]
authors = [{name = "Wu X.", email = "wux024@nenu.edu.cn"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Neuroscience",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]

# Core dependencies for CLI and non-GUI workflows
dependencies = [
    "numpy>=1.23.0",
    "matplotlib>=3.3.0",
    "opencv-contrib-python>=4.6.0",
    "pillow>=7.1.2",
    "pyyaml>=5.3.1",
    "requests>=2.23.0",
    "scipy>=1.4.1",
    "py-cpuinfo", 
    "scikit-learn>=1.3.2", 
    # ONNX runtime is an either/or choice: the CPU package and onnxruntime-gpu
    # are separate distributions that provide the same `onnxruntime` module, so
    # pinning one here silently clobbers the other. Pick one via the extras below.
    "tqdm>=4.64.0",
]

[project.optional-dependencies]
onnx-cpu = ["onnxruntime>=1.10.0"]
onnx-gpu = ["onnxruntime-gpu>=1.10.0"]
gui = [
    "PySide6>=6.2.4",
    "PyCameraList>=1.0.0; platform_system == 'Windows'",
]
training = [
    "torch>=2.0.0",
    "pycocotools>=2.0.7",
]
export = ["onnx>=1.14.0", "onnxsim>=0.4.0"]
export-openvino = ["openvino>=2024.0.0"]
export-coreml = ["coremltools>=8.0"]
export-tensorflow = ["tensorflow>=2.0.0", "onnx2tf>=1.26.3", "tensorflowjs"]
export-paddle = ["paddlepaddle>=3.0.0", "x2paddle"]
export-mnn = ["MNN>=2.9.6"]
export-ncnn = ["ncnn"]
predict-triton = ["tritonclient[http,grpc]"]
pose3d-numba = ["numba>=0.62"]
pose3d-jax = ["jax[cuda12]>=0.4.30"]


# Package discovery configuration
[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["animalposetracker*"]

[tool.setuptools.package-data]
animalposetracker = [
    "cfg/*.yaml",
    "cfg/models/*.yaml",
    "cfg/datasets/*.yaml",
]
# The GUI's images and stylesheets live under `animalposetracker/gui/`, so they need their own
# key. The paths here used to point at `animalposetracker/assets` and `animalposetracker/style`,
# which do not exist -- the built wheel carried no `.png` and no `.qss`, so an installed GUI had
# a blank splash screen, no icons and no theme.
"animalposetracker.gui" = [
    "assets/*.png",
    "media/*.png",
    "style/*.qss",
]

[tool.setuptools.dynamic]
version = { attr = "animalposetracker.__version__" }

[tool.setuptools.exclude-package-data]
animalposetracker = [
    "**/__pycache__/*"
]

# Entry points (if creating CLI tools)
[project.scripts]
"animalposetracker" = "animalposetracker.gui.mainpage:main"
"animalpose-cli" = "animalposetracker.cli:main"
"animalpose-inferencer" = "animalposetracker.gui.inferencerpage:main"
"animalpose-annotator" = "animalposetracker.gui.annotatorpage:main"
