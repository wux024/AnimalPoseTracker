# AnimalRTMO - one-stage (bottom-up) multi-instance pose estimation.
#
# Structure: a YOLO26 backbone (C3k2 / C2PSA, the same graph as yolo26-pose), the
# RTMO hybrid-encoder neck (transformer encoder + FPN + PAN) and the RTMO head
# with its dynamic coordinate classifier. Bottom-up means no detector and no
# instance crops: every positive grid predicts a box and a full pose at once.
#
# References:
#   - RTMO: "RTMO: Towards High-Performance One-Stage Real-Time Multi-Person
#     Pose Estimation" (CVPR 2024), mmpose implementation;
#   - YOLO26 backbone blocks, ultralytics 8.4.175.
#
# Deviations from the reference, on purpose: the backbone is YOLO26 instead of
# CSPDarknet, and the classification branch supports more than one class -- the
# reference trains at nc=1 (class-agnostic), its loss collapses the class target
# to a scalar.
#
# The head's loss-side runtime pieces -- prior generator, SimOTA assigner and the
# six loss objects -- are injected by the trainer (training/losses.py RTMOLoss),
# not carried here: this yaml only fixes the network graph.

nc: 1 # (int) number of classes; the trainer sets this from the dataset. One class reproduces
      # the reference (class-agnostic person) setup; more classes train a multi-class head.
kpt_shape: [17, 3] # (list) number of keypoints, number of dims (x, y, visible)
scales: # compound scaling constants, shared with yolo26-pose
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26 backbone (yolo26-pose rows 0-10, unchanged)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4 (P3/8 feeds the neck)
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6 (P4/16 feeds the neck)
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10 (P5/32 feeds the neck)

head:
  # RTMO hybrid encoder: the transformer runs over P5, then FPN + PAN; the two
  # outputs (indices 1 and 2 of the pyramid, i.e. P4/16 and P5/32) are projected
  # to hidden_dim and handed to the head as one item.
  # [hidden_dim, use_encoder_idx, num_encoder_layers, output_indices]
  - [[4, 6, 10], 1, HybridEncoder, [256, [2], 1, [1, 2]]] # 11

  # RTMO head: per-grid box plus a full pose, decoded by the dynamic coordinate
  # classifier. in_channels is derived from the neck (each map is split in half),
  # so head_module_cfg only writes the widths, and dcc_cfg gets its input width
  # from pose_vec_channels.
  # [num_keypoints, featmap_strides, head_module_cfg, dcc_cfg]
  - [-1, 1, RTMOHead,
     [num_keypoints, [16, 32],
      {cls_feat_channels: 128, channels_per_group: 18, pose_vec_channels: 256, stacked_convs: 2, num_groups: 8},
      {feat_channels: 128, num_bins: [192, 256], spe_channels: 128,
       gau_cfg: {s: 128, expansion_factor: 2, dropout_rate: 0.0, drop_path: 0.0, act_fn: SiLU, pos_enc: add}}]] # 12
