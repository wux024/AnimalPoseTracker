# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLOv8-pose keypoints/pose estimation model. For Usage examples see https://docs.ultralytics.com/tasks/pose

# Parameters
nc: 50 # number of classes
kpt_shape: [17, 3] # number of keypoints, number of dims (2 for x,y or 3 for x,y,visible)
scales: # model compound scaling constants, i.e. 'model=yolov8n-pose-cspnext.yaml' will call yolov8-pose-cspnext.yaml with scale 'n'
  #  [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# Full AnimalRTPose checkpoints by model scale. These are full pose-model weights;
# AnimalViTPose's separate MAE backbone initialization URLs live in its model variants.
pretrained_urls:
  n: https://drive.google.com/uc?export=download&id=1sl8WQGFcB2lD-W5rVqKS3kauK0ZwX_zV
  s: https://drive.google.com/uc?export=download&id=1ehkMFUwOEpaQRRNX6l5c2XsFFCRP6n83
  m: https://drive.google.com/uc?export=download&id=1G5E0AenDdYXGH90Uv9ppUEeUVrpv7PhH
  l: https://drive.google.com/uc?export=download&id=1jT1SxpFP3C5Rn87vfMmZ__oqzy3IJViW
  x: https://drive.google.com/uc?export=download&id=1SfoeM85OPBBsgpwmA-ryMKKhgPijjyt2

# CSPNeXt backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, STEM, [64]] # 0-P1/2
  # CSPNeXt blocks
  - [-1, 1, Conv, [128, 3, 2, 1]] # 1-P2/4
  - [-1, 3, CSPNeXtBlock, [128, True, False, True]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2, 1]] # 3-P3/8
  - [-1, 6, CSPNeXtBlock, [256, True, False, True]] # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2, 1]] # 5-P4/16
  - [-1, 6, CSPNeXtBlock, [512, True, False, True]] # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2, 1]] # 7-P5/32
  - [-1, 3, CSPNeXtBlock, [1024, False, True, True]] # 8-P5/32

# CSPNeXt head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 9
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 3, CSPNeXtBlock, [512]] # 11

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 3, CSPNeXtBlock, [256]] # 14 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]] # cat head P4
  - [-1, 3, CSPNeXtBlock, [512]] # 17 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]] # cat head P5
  - [-1, 3, CSPNeXtBlock, [1024]] # 20 (P5/32-large)

  - [[14, 17, 20], 1, YOLOPoseHead, [nc, kpt_shape]] # Pose(P3, P4, P5)
