# AnimalPoseTracker -- infer configuration template
# -----------------------------------------------------------------
# The inference runtime's config template (animalpose-cli infer).
# Copy this file, uncomment and edit the values you need, then pass
# it with --config:
#
#   animalpose-cli infer --poser-weights model.onnx --source video.mp4 \
#       --config infer.example.yaml
#
# Precedence: command line > this file > built-in defaults. Write
# only the keys you want to change; every configurable key with its
# default is listed below. Regenerate this template with:
#   animalpose-cli infer --write-template [PATH]
# The inferencer reads no project configuration: this yaml, the
# model artifact and its sidecar metadata are all it sees.
#
# Keys use the same canonical spellings as the project workflows
# (conf / iou / device ...); the data description (names / kpt_shape
# / skeleton and friends) may also live in this file.

# ---- Model and backend (usually given on the command line) --------
# poser_weights: model.onnx       # exported pose artifact (.onnx / .engine / ...)
# detector_weights: detector.onnx  # second-stage detector (enables the top-down stream)
# engine: onnx                     # inference backend; defaults to the artifact format
# device: auto                     # auto / cpu / cuda:0 / "NVIDIA GPU" / ...
# bits: FP32                       # FP32 / FP16 / INT8
# imgsz: 640                       # fallback input size when the artifact carries no sidecar

# ---- Input ---------------------------------------------------------
# source: video.mp4                # camera index (0) / video file / stream URL

# ---- Thresholds ----------------------------------------------------
# conf: 0.25                       # pose confidence threshold
# iou: 0.45                        # NMS IoU (consumed by raw output layouts only)
# agnostic_nms: true               # class-agnostic NMS
# detector_conf: 0.5               # second-stage detector confidence

# ---- Second-stage detector conventions (rarely changed) ------------
# detector_box_format: cxcywh         # cxcywh / xyxy
# detector_coord_mode: normalized     # normalized / pixels
# detector_preprocess_mode: stretch   # stretch / letterbox

# ---- Pose output layout --------------------------------------------
# schema: auto                     # auto / ultralytics_yolo_pose_raw / ..._nms / ...

# ---- Rendering -----------------------------------------------------
# show_boxes: true                 # draw boxes
# show_labels: true                # draw class labels
# show_keypoints: true             # draw keypoints
# show_skeletons: true             # draw skeleton lines
# line_width: 2                    # line width
# point_radius: 4                  # keypoint radius

# ---- Tracking and temporal filtering (video) -----------------------
# tracker: bytetrack               # bytetrack / botsort / ocsort / deepocsort / fasttrack / tracktrack
# pose_filter: none                # none / median / savgol
# filter_window: 5                 # smoothing window in frames
# filter_polyorder: 2              # Savitzky-Golay polynomial order
# filter_confidence: 0.25          # filter confidence threshold
# filter_max_gap: 0                # maximum missing-frame gap to interpolate

# ---- Output --------------------------------------------------------
# output: rendered.mp4             # rendered video output path
# records: records.json            # per-frame pose/tracking records output path
# show: false                      # pop up a window (where a desktop is available)
# max_frames:                      # stop after this many frames

# ---- Data description (also allowed here; data keys coexist with the run keys) ----
# names: {0: animal}
# kpt_shape: [17, 3]
# skeleton: []
