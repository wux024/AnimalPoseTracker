# Runtime parameter defaults -- the common / predict / export scopes.
# Mirrors the W0 concept dictionary (2026-10-14), sections 3/4/5.
# Train defaults live in training.yaml; the infer defaults live in the neutral
# constants module (not in this file).
# Key names follow the dictionary; this file is the single source of their
# default values (code no longer copies default literals).

common:
  device: auto
  project: runs
  name: train
  exist_ok: false
  selected_weights:      # GUI model selection; null = use runs/<name>/weights/best.pt

predict:
  source:
  confidence: 0.25
  iou: 0.7
  max_det: 300
  agnostic_nms: false
  keypoint_confidence: 0.25
  dnn: false
  show_labels: true
  show_conf: true
  show_boxes: true
  show_keypoints: true
  show_skeletons: false
  line_width: 2
  point_radius: 4
  tracking:
    enabled: false
    algorithm: bytetrack
  pose_filter:
    method: none
    window_length: 5
    polyorder: 2
    max_gap: 0
    confidence_threshold:      # null = inherit keypoint_confidence

export:
  format:
  half: false
  dynamic: false
  simplify: true
  opset: 17
  workspace: 4.0
  rknn_target: rk3588
  optimize: false
  int8: false
  keras: false
  nms: false
