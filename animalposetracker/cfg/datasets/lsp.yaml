# Leeds Sports Pose: 14-keypoint athlete images (Johnson and Everingham, ECCV 2010)
# Download: http://sam.johnson.io/research/lsp.html

# Keypoint order: right ankle, right knee, right hip, left hip, left knee, left ankle,
# right wrist, right elbow, right shoulder, left shoulder, left elbow, left wrist, neck, head top.

# Train/val/test sets as 1) dir: path/to/imgs, 2) file: path/to/imgs.txt, or 3) list: [path/to/imgs1, path/to/imgs2, ..]
path: lsp # dataset root dir
train: images/train # train images (relative to 'path') 4 images
val: images/val # val images (relative to 'path') 4 images
test: images/test # test images (relative to 'path') 4 images

# Keypoints
kpt_shape: [14, 3] # number of keypoints, number of dims (2 for x,y or 3 for x,y,visible)
flip_idx: [5, 4, 3, 2, 1, 0, 11, 10, 9, 8, 7, 6, 12, 13] # mirror: ankle/knee/hip/wrist/elbow/shoulder pairs swap, neck and head top stay

# Classes
names:
  0: person

skeleton:
  [[0, 1], [1, 2], [2, 3], [3, 4], [4, 5], [6, 7], [7, 8], [8, 9], [9, 10], [10, 11], [8, 12], [9, 12], [12, 13]]
